<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#fbfaf8;color:#1b1714;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{.Preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fbfaf8;">
<tr>
<td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e4e0da;">
<tr>
<td style="padding:24px 32px;border-bottom:1px solid #e4e0da;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:28px;font-weight:400;letter-spacing:0.12em;color:#1b1714;">{{.Brand.Name}}</td>
</tr>
<tr>
<td style="padding:32px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#4a423b;">
<p style="margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#7d6432;">{{.Eyebrow}}</p>
<h1 style="margin:0 0 24px;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:32px;font-weight:400;line-height:1.2;color:#1b1714;">{{.Heading}}</h1>
<p style="margin:0 0 16px;">{{.Greeting}}</p>
{{range .Lead}}<p style="margin:0 0 16px;">{{.}}</p>
{{end}}{{block "details" .}}{{end}}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 0;">
<tr>
<td style="background-color:#23402f;">
<a href="{{.ActionURL}}" style="display:inline-block;padding:14px 28px;font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#ffffff;text-decoration:none;">{{.ActionLabel}}</a>
</td>
</tr>
</table>
{{block "after" .}}{{end}}</td>
</tr>
<tr>
<td style="padding:24px 32px;border-top:1px solid #e4e0da;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#6f675e;">
<p style="margin:0 0 4px;">{{.Brand.Name}} · {{.Brand.AddressLine}} · {{.Brand.ContactPhone}} · <a href="mailto:{{.Brand.ContactEmail}}" style="color:#6f675e;">{{.Brand.ContactEmail}}</a></p>
<p style="margin:0;">{{.FooterNote}}</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
