# Local dev: Redis and Mailpit. PostgreSQL = Neon (cloud) — set POSTGRES_URL in .env.
#   docker compose -f scripts/docker-compose.dev.yml up -d

services:
  redis:
    image: redis:8-alpine
    container_name: boms-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Catches every email the worker sends and delivers none: read them at
  # http://localhost:8025. The worker's default MAIL_* settings point here.
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: boms-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
