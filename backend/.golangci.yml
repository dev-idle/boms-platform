version: "2"

run:
  tests: true
  timeout: 4m

linters:
  enable:
    # Correctness & cleanliness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - sqlclosecheck
    - bodyclose
    - noctx
    # Security (OWASP-style static analysis for Go)
    - gosec
  exclusions:
    paths:
      - internal/adapter/repository/postgres/sqlcgen

linters-settings:
  gosec:
    excludes:
      - G104 # overlaps with errcheck on non-test code

issues:
  max-same-issues: 50
