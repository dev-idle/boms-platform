name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (types, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 11.2.2

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Design-token gate
        run: pnpm run check:design

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build
        env:
          # Required for next.config CSP / headers at build time
          BOMS_BACKEND_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  security:
    name: Security (dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 11.2.2

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high+)
        run: pnpm run audit:ci
