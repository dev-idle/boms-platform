name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      # Contract tests read these: the shared phone cases and the frontend's
      # mirror of the error codes (internal/shared/errors/contract_test.go).
      - "contracts/**"
      - "frontend/src/lib/errors/api-error.ts"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      # Contract tests read these: the shared phone cases and the frontend's
      # mirror of the error codes (internal/shared/errors/contract_test.go).
      - "contracts/**"
      - "frontend/src/lib/errors/api-error.ts"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (verify, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify module integrity
        run: go mod verify

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: make ci
        run: make ci

      - name: golangci-lint
        # v7+ = golangci-lint v2 only; v9+ = Node 24 runtime (GitHub deprecates Node 20 actions).
        uses: golangci/golangci-lint-action@v9
        with:
          # v1.x does not support Go 1.26 (see go.mod toolchain); v2.9+ does.
          version: v2.13.2
          working-directory: backend
          args: --timeout=4m

      - name: go test -race
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      # Coverage is reported, not gated: a threshold rewards tests written for the
      # number. The summary shows where a change left a package untested.
      - name: Coverage summary
        run: |
          {
            echo '### Backend coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: make build
        run: make build

  security:
    name: Security (vulnerability scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
