packages:
  - .

# eslint-plugin-react (via eslint-config-next) is not compatible with ESLint 10 yet.
overrides:
  eslint: ~9.39.4

# pnpm 11+: lifecycle scripts only for listed deps (supply-chain default).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Registry default is 1440m; fresh security patches can be younger — keep installs predictable for app deps.
minimumReleaseAge: 0
